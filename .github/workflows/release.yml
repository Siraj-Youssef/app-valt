# Gera o APK do Rumo (Android) de graça nos servidores do GitHub.
# Roda sozinho a cada push que mexe no app; o .apk fica em "Artifacts", no fim da página da execução
# (Actions → Gerar APK → a execução mais recente). Uma tag vX.Y.Z também publica o .apk numa Release.
name: Gerar APK

on:
  workflow_dispatch:
  push:
    branches: ['**']
    tags: ['v*']
    paths: ['app/**', '.github/workflows/release.yml']

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
        working-directory: app
      - run: npx tsc --noEmit
        working-directory: app
      - run: npx expo prebuild --platform android --no-install
        working-directory: app
      # O modelo do Expo assina o APK de release com a chave de debug que vem no próprio modelo
      # (a mesma em todo build): instala e atualiza direto no celular, mas não serve para a Play Store.
      - run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
        working-directory: app/android
      - run: mv app/android/app/build/outputs/apk/release/app-release.apk Rumo.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Rumo-android
          if-no-files-found: error
          path: Rumo.apk
      - name: Publicar Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" Rumo.apk --clobber
          else
            gh release create "$GITHUB_REF_NAME" Rumo.apk --title "Rumo $GITHUB_REF_NAME" --notes "Baixe o Rumo.apk no celular Android e permita instalar de fontes desconhecidas."
          fi
