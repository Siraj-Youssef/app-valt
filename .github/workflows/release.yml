# Gera o APK do Rumo (Android) de graça nos servidores do GitHub.
# Roda sozinho a cada push que mexe no app. O .apk mais recente fica no branch "apk"
# (https://github.com/Siraj-Youssef/app-valt/raw/apk/Rumo.apk) e também em "Artifacts" da execução.
# Uma tag vX.Y.Z também publica o .apk numa Release.
name: Gerar APK

on:
  workflow_dispatch:
  push:
    branches: ['**']
    tags: ['v*']
    paths: ['app/**', '.github/workflows/release.yml']

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
        working-directory: app
      - run: npx tsc --noEmit
        working-directory: app
      - run: npx expo prebuild --platform android --no-install
        working-directory: app
      # O modelo do Expo assina o APK de release com a chave de debug que vem no próprio modelo
      # (a mesma em todo build): instala e atualiza direto no celular, mas não serve para a Play Store.
      - run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
        working-directory: app/android
      - run: mv app/android/app/build/outputs/apk/release/app-release.apk Rumo.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Rumo-android
          if-no-files-found: error
          path: Rumo.apk
      # Guarda o APK mais recente sozinho no branch "apk" (um commit só, sobrescrito a cada build):
      # link fixo para baixar no celular: https://github.com/<dono>/<repo>/raw/apk/Rumo.apk
      - name: Atualizar o branch apk
        if: github.ref_type == 'branch'
        env:
          TOKEN: ${{ github.token }}
        run: |
          mkdir pub && cp Rumo.apk pub/ && cd pub
          git init -q -b apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Rumo.apk
          git commit -qm "Rumo.apk de ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" apk
      - name: Publicar Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" Rumo.apk --clobber
          else
            gh release create "$GITHUB_REF_NAME" Rumo.apk --title "Rumo $GITHUB_REF_NAME" --notes "Baixe o Rumo.apk no celular Android e permita instalar de fontes desconhecidas."
          fi
